services:
  - type: web
    name: starcoder-online
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - {key: PYTHON_VERSION, value: 3.11.9}
      - {key: JSONBIN_API_BASE, value: "https://jsonbinbro.onrender.com/api"}
      - {key: JSONBIN_BIN_ID, sync: false}
      - {key: JSONBIN_USER_ID, sync: false}
      - {key: JSONBIN_API_KEY, sync: false}
      - {key: SUPER_ADMIN_ID, value: superadmin}
      - {key: SUPER_ADMIN_PASSWORD, sync: false}
