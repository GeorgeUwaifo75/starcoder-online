[`What is the payment information?`,`<b>Bank:</b> Access Bank<br><b>Account number:</b> 1221166128<br><b>Account name:</b> GiTeksol Solutions Limited<br>Please use your User ID as the payment reference so we can credit the right account quickly.`],
[`How can I contact support?`,`<b>Email:</b> <a href="mailto:geocorpsys@gmail.com">geocorpsys@gmail.com</a><br><b>Telephone:</b> <a href="tel:09038197586">09038197586</a>`],
[`What are the different types of users?`,`<b>Super Administrator</b> - controls every company account: activates or deactivates administrators and tops up wallets.<br><b>Administrator</b> - the account created at sign-up. Manages products, purchases, reports, users, settings and deletions, and can create other administrators.<br><b>Semi-Administrator</b> - an administrator with limited rights. You decide whether they can view reports, create users or delete the last transaction.<br><b>Normal user</b> - the sales person. Can make sales, look up products and print their own sales; can delete the last transaction or view sales reports only if you allow it.`],
[`How do I create, edit or remove a user? What if someone forgets a password?`,`Go to <b>Users</b>. To add someone, enter their names, a password and a role, tick the permissions you want to give, then click <b>Create</b> and give them the User ID shown. To change a name, role or password click <b>Edit</b> on their row. You can also disable or delete users there. If a staff member forgets their password, edit the user and set a new one. If an administrator forgets theirs, please contact support.`],
[`How do I add products and use a barcode scanner?`,`Open <b>Products</b>, scan the barcode (the scanner types the code into the Product code box) or type it, then enter the name, prices, quantity and other details. The description copies the name until you change it. You can add an optional photo, supplier details and minimum/maximum stock. A new product is also recorded as a purchase. Use <b>Purchases</b> later to restock.`],
[`How do I sell items by weight or volume (kg, litres)?`,`When adding the product set <b>Type</b> to <i>Fractional</i>. You can then sell quantities like 0.5 or 3.5 at the point of sale. Discrete products only accept whole numbers.`],
[`How do I make a sale?`,`In <b>Sales</b>, scan a barcode or type a product name and press Enter. Change the quantity, pick a wholesale price if needed and tick the discount box when a product has one. Choose the payment type (Cash, Card or Transfer) and click <b>Complete sale</b>. You can add or remove items freely before completing.`],
[`How do receipts print?`,`After every successful sale a receipt opens in your browser's print window and goes to your receipt printer. The Administrator sets how many copies print and the footer message (for example "Thank you, come again") under <b>Settings</b>.`],
[`How is VAT handled?`,`The Administrator sets the VAT percentage in <b>Settings</b> (default 0). When it is above 0, VAT is added to every sale, shown on the receipt and included in the sales reports.`],
[`How do I delete transactions?`,`<b>Last transaction:</b> in Sales click <i>Delete last transaction</i> (available to administrators and to users you permit). Stock is restored, but wallet units are never refunded.<br><b>Older transactions:</b> administrators open <b>Transactions</b>, filter, tick the sales and click <i>Delete selected</i>. You choose whether to restore stock. Wallet units are never refunded.<br><b>Bulk clean-up:</b> in <b>Settings</b>, delete everything before a chosen date. Deletions are permanent, but each one is recorded for the Administrator under <b>Reports &rarr; deleted</b> (who deleted it, when, and the full sale details). A bulk clean-up is logged as one summary line.`],
[`What reports can I get and can I export them?`,`<b>Reports</b> has sales, purchases, profit and loss, stock and charts (best sellers, best margins and monthly totals). Filter by date, product or seller, then export to CSV, Excel or PDF, or print.`],
[`How do I back up and restore my data?`,`In <b>Settings</b> use <i>Download backup</i> regularly to save your products, sales, purchases and settings as a file. To restore, choose that file under <i>Restore from file</i>. Keep backups somewhere safe, especially before deleting old transactions.`]
];
const FAQ_ES=[
[`¿Cómo empiezo?`,`1) En la página de inicio de sesión pulse <b>Registrarse</b> e ingrese su nombre, apellido, nombre de la empresa, una contraseña (dos veces) y el idioma. 2) Anote el <b>ID de usuario</b> que aparece tras el registro (tiene la forma <i>nombre.apellido</i>) e inicie sesión con él. 3) Abra <b>Configuración</b> y complete la dirección, teléfono, correo, logotipo, IVA, idioma, moneda y pie del recibo de su empresa. 4) Agregue sus productos en <b>Productos</b>. 5) Comience a vender en <b>Ventas</b>.`],
[`¿Qué son las unidades de la billetera y cómo funcionan?`,`Cada cuenta de empresa nueva comienza con <b>100 unidades</b>. Cada venta exitosa usa <b>20 unidades</b>, que se descuentan en tiempo real de la billetera de la empresa (compartida por todo el personal de su cuenta). El saldo de la billetera y su número de ventas se muestran siempre en la parte superior de la pantalla. Si la billetera tiene menos de 20 unidades no se puede completar ninguna venta hasta que recargue.`],
[`¿Cómo recargo mi billetera?`,`Pague en la cuenta bancaria indicada en la pregunta de Información de pago y envíe su comprobante de pago y su <b>ID de usuario</b> al correo o teléfono de contacto. El Superadministrador acreditará en su billetera las unidades pagadas y el nuevo saldo aparecerá automáticamente en su pantalla.`],
[`¿Cuál es la información de pago?`,`<b>Banco:</b> Access Bank<br><b>Número de cuenta:</b> 1221166128<br><b>Nombre de la cuenta:</b> GiTeksol Solutions Limited<br>Use su ID de usuario como referencia del pago para que podamos acreditar la cuenta correcta rápidamente.`],
[`¿Cómo puedo contactar a soporte?`,`<b>Correo:</b> <a href="mailto:geocorpsys@gmail.com">geocorpsys@gmail.com</a><br><b>Teléfono:</b> <a href="tel:09038197586">09038197586</a>`],
[`¿Qué tipos de usuarios existen?`,`<b>Superadministrador</b> - controla todas las cuentas de empresa: activa o desactiva administradores y recarga billeteras.<br><b>Administrador</b> - la cuenta creada al registrarse. Gestiona productos, compras, informes, usuarios, configuración y eliminaciones, y puede crear otros administradores.<br><b>Semiadministrador</b> - un administrador con derechos limitados. Usted decide si puede ver informes, crear usuarios o eliminar la última transacción.<br><b>Usuario normal</b> - el vendedor. Puede realizar ventas, consultar productos e imprimir sus propias ventas; solo puede eliminar la última transacción o ver informes de ventas si usted lo permite.`],
[`¿Cómo creo, edito o elimino un usuario? ¿Y si alguien olvida su contraseña?`,`Vaya a <b>Usuarios</b>. Para agregar a alguien, ingrese sus nombres, una contraseña y un rol, marque los permisos que desee darle, pulse <b>Crear</b> y entréguele el ID de usuario que aparece. Para cambiar un nombre, rol o contraseña pulse <b>Editar</b> en su fila. También puede deshabilitar o eliminar usuarios allí. Si un empleado olvida su contraseña, edite el usuario y asigne una nueva. Si un administrador olvida la suya, contacte a soporte.`],
[`¿Cómo agrego productos y uso un lector de códigos de barras?`,`Abra <b>Productos</b>, escanee el código de barras (el lector escribe el código en el campo Código del producto) o escríbalo, luego ingrese el nombre, precios, cantidad y demás datos. La descripción copia el nombre hasta que la cambie. Puede agregar una foto opcional, datos del proveedor y stock mínimo/máximo. Un producto nuevo también se registra como una compra. Use <b>Compras</b> más adelante para reabastecer.`],
[`¿Cómo vendo artículos por peso o volumen (kg, litros)?`,`Al agregar el producto, configure <b>Tipo</b> como <i>Fraccionario</i>. Así podrá vender cantidades como 0.5 o 3.5 en el punto de venta. Los productos discretos solo aceptan números enteros.`],
[`¿Cómo realizo una venta?`,`En <b>Ventas</b>, escanee un código de barras o escriba el nombre del producto y pulse Enter. Cambie la cantidad, elija un precio mayorista si es necesario y marque la casilla de descuento cuando el producto tenga uno. Elija el tipo de pago (Efectivo, Tarjeta o Transferencia) y pulse <b>Completar venta</b>. Puede agregar o quitar artículos libremente antes de completar.`],
[`¿Cómo se imprimen los recibos?`,`Después de cada venta exitosa se abre el recibo en la ventana de impresión del navegador y se envía a su impresora de recibos. El Administrador define cuántas copias se imprimen y el mensaje del pie (por ejemplo "Gracias, vuelva pronto") en <b>Configuración</b>.`],
[`¿Cómo se maneja el IVA?`,`El Administrador define el porcentaje de IVA en <b>Configuración</b> (por defecto 0). Cuando es mayor que 0, el IVA se suma a cada venta, aparece en el recibo y se incluye en los informes de ventas.`],
[`¿Cómo elimino transacciones?`,`<b>Última transacción:</b> en Ventas pulse <i>Eliminar última transacción</i> (disponible para administradores y para los usuarios que usted autorice). El stock se restaura, pero las unidades de la billetera nunca se reembolsan.<br><b>Transacciones antiguas:</b> los administradores abren <b>Transacciones</b>, filtran, marcan las ventas y pulsan <i>Eliminar seleccionadas</i>. Usted decide si se restaura el stock. Las unidades de la billetera nunca se reembolsan.<br><b>Depuración masiva:</b> en <b>Configuración</b>, elimine todo lo anterior a una fecha elegida. Las eliminaciones son permanentes, pero cada una queda registrada para el Administrador en <b>Informes → eliminadas</b> (quién la eliminó, cuándo y todos los detalles de la venta). Una depuración masiva se registra como una línea de resumen.`],
[`¿Qué informes puedo obtener y puedo exportarlos?`,`<b>Informes</b> incluye ventas, compras, pérdidas y ganancias, inventario y gráficos (más vendidos, mejores márgenes y totales mensuales). Filtre por fecha, producto o vendedor y exporte a CSV, Excel o PDF, o imprima.`],
[`¿Cómo hago una copia de seguridad y la restauro?`,`En <b>Configuración</b> use <i>Descargar copia</i> con regularidad para guardar sus productos, ventas, compras y ajustes en un archivo. Para restaurar, elija ese archivo en <i>Restaurar desde archivo</i>. Guarde las copias en un lugar seguro, sobre todo antes de eliminar transacciones antiguas.`]
];
function faqV(){$("#m").innerHTML=`<div class=card><h3>Frequently asked questions</h3><input id=fq placeholder="Search the FAQs"><div id=fl></div></div>`;
 const d=()=>{const q=$("#fq").value.toLowerCase().trim();$("#fl").innerHTML=(LANG=="es"?FAQ_ES:FAQ).map((f,i)=>[i,f]).filter(([i,f])=>(f[0]+f[1]).toLowerCase().includes(q)).map(([i,f])=>`<details class=fa ${q?"open":""}><summary>${i+1}. ${f[0]}</summary><div>${f[1]}</div></details>`).join("")||"<p><i>No match.</i></p>"};$("#fq").oninput=d;d()}
/* ---------- settings ---------- */
function setV(){const c=S.company,s=S.system;$("#m").innerHTML=`<div class=card><h3>Company information</h3><div class=g>${inp("cn","Company name","text",c.name)}${inp("ca","Address","text",c.address)}${inp("cp","Telephone","text",c.phone)}${inp("ce","Email","email",c.email)}${inp("cv","VAT %","number",c.vat||0)}<label>Logo (optional)<input id=cl type=file accept="image/*"></label></div></div>
<div class=card><h3>System information</h3><div class=g>${inp("sm","Max transactions before clean-up alert","number",s.max_tx)}${inp("sc","Receipt copies","number",s.copies)}${inp("sf","Receipt footer","text",s.footer)}<label>Language / Idioma<select id=sl onchange="$('#scu').value=this.value=='es'?'PESO':'NGN'"><option value=en ${LANG!="es"?"selected":""}>English</option><option value=es ${LANG=="es"?"selected":""}>Español</option></select></label><label>Currency<select id=scu>${Object.keys(CURS).map(k=>`<option value=${k} ${k==curKey()?"selected":""}>${CURS[k][LANG=="es"?2:1]} (${CURS[k][0]})</option>`).join("")}</select></label></div><br><button class=y onclick="saveS()">Save settings</button></div>
<div class=card><h3>Clean-up tool</h3><div class=g>${inp("cd","Delete transactions before","date")}</div><br><button class=r onclick="clean()">Delete old transactions</button></div>
<div class=card><h3>Backup &amp; restore</h3><button onclick="bk()">Download backup</button> <label style="display:inline-block">Restore from file<input id=rf type=file accept=".json" onchange="rs(this.files[0])"></label></div>`}
const saveS=()=>go(async()=>{let logo=S.company.logo;const f=$("#cl").files[0];if(f)logo=await up(f,"logos");const r=await api("/settings","PUT",{company:{name:$("#cn").value,address:$("#ca").value,phone:$("#cp").value,email:$("#ce").value,vat:$("#cv").value,logo},system:{max_tx:$("#sm").value,copies:$("#sc").value,footer:$("#sf").value,lang:$("#sl").value,currency:$("#scu").value}});S={...S,...r};await boot();show("settings");alert(T("Saved"))});
const clean=()=>go(async()=>{if(!confirm(LS("This permanently deletes sales before that date. Download a backup first. Continue?","Esto elimina permanentemente las ventas anteriores a esa fecha. Descargue primero una copia de seguridad. ¿Continuar?")))return;const r=await api("/cleanup","POST",{before:$("#cd").value});alert(r.deleted+" "+LS("transactions deleted","transacciones eliminadas"));S={...S,...await api("/me")};hdr()});
const bk=()=>go(async()=>{const d=await api("/backup"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(d)],{type:"application/json"}));a.download="backup-"+new Date().toISOString().slice(0,10)+".json";a.click()});
const rs=f=>go(async()=>{if(!f||!confirm(LS("Replace ALL current company data with this backup?","¿Reemplazar TODOS los datos actuales de la empresa con esta copia?")))return;await api("/restore","POST",JSON.parse(await f.text()));S={...S,...await api("/me")};P=await api("/products");hdr();alert(T("Restored"))});
/* ---------- super admin ---------- */
async function accV(){const a=await api("/accounts");$("#m").innerHTML=`<div class=card><h3>Administrator accounts</h3>${tbl(["User ID","Name","Company","Wallet","Status","Top up","",],a.map(x=>[x.id,x.name,x.company,x.wallet,x.active?"Active":"Disabled",`<!><input id=tu_${x.id.replace(/\W/g,"_")} type=number style="width:90px" placeholder="units"> <button class=y onclick="topup('${x.id}')">Add</button>`,`<!><button onclick="acts('${x.id}',${!x.active})">${x.active?"Deactivate":"Activate"}</button>`]))}</div>`}
const topup=id=>go(async()=>{await api(`/accounts/${id}/topup`,"POST",{units:$("#tu_"+id.replace(/\W/g,"_")).value});accV()}),acts=(id,a)=>go(async()=>{await api(`/accounts/${id}/active`,"POST",{active:a});accV()});
if(TOK)api("/me").then(r=>{S=r;boot()}).catch(authView);else authView();
</script></body></html>
