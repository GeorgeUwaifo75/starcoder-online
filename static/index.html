/* ---------- FAQ ---------- */
const FAQ=[
[`How do I get started?`,`1) On the login page click <b>Sign up</b> and enter your first name, last name, company name and a password (twice). 2) Note the <b>User ID</b> shown after sign-up (it looks like <i>first.last</i>) and log in with it. 3) Open <b>Settings</b> and fill in your company address, telephone, email, logo, VAT, language, currency and receipt footer. 4) Add your products in <b>Products</b>. 5) Start selling in <b>Sales</b>.`],
[`What are wallet units and how do they work?`,`Every new company account starts with <b>100 units</b>. Each successful sale uses <b>20 units</b>, deducted in real time from the company wallet (shared by all staff under your account). The wallet balance and your number of sales are always shown at the top of the screen. When the wallet is below 20 units no sale can be completed until you top up.`],
[`How do I top up my wallet?`,`Pay into the bank account in the Payment Information question below, then send your proof of payment and your <b>User ID</b> to our contact email or phone number. The Super Administrator will credit your wallet with the units you paid for, and the new balance appears on your screen automatically.`],
[`What is the payment information?`,`<b>Bank:</b> Access Bank<br><b>Account number:</b> 1221166128<br><b>Account name:</b> GiTeksol Solutions Limited<br>Please use your User ID as the payment reference so we can credit the right account quickly.`],
[`How can I contact support?`,`<b>Email:</b> <a href="mailto:geocorpsys@gmail.com">geocorpsys@gmail.com</a><br><b>Telephone:</b> <a href="tel:09038197586">09038197586</a>`],
[`What are the different types of users?`,`<b>Super Administrator</b> - controls every company account: activates or deactivates administrators and tops up wallets.<br><b>Administrator</b> - the account created at sign-up. Manages products, purchases, reports, users, settings and deletions, and can create other administrators.<br><b>Semi-Administrator</b> - an administrator with limited rights. You decide whether they can view reports, create users or delete the last transaction.<br><b>Normal user</b> - the sales person. Can make sales, look up products and print their own sales; can delete the last transaction or view sales reports only if you allow it.`],
[`How do I create, edit or remove a user? What if someone forgets a password?`,`Go to <b>Users</b>. To add someone, enter their names, a password and a role, tick the permissions you want to give, then click <b>Create</b> and give them the User ID shown. To change a name, role or password click <b>Edit</b> on their row. You can also disable or delete users there. If a staff member forgets their password, edit the user and set a new one. If an administrator forgets theirs, please contact support.`],
[`How do I add products and use a barcode scanner?`,`Open <b>Products</b>, scan the barcode (the scanner types the code into the Product code box) or type it, then enter the name, prices, quantity and other details. The description copies the name until you change it. You can add an optional photo, supplier details and minimum/maximum stock. A new product is also recorded as a purchase. Use <b>Purchases</b> later to restock.`],
[`How do I sell items by weight or volume (kg, litres)?`,`When adding the product set <b>Type</b> to <i>Fractional</i>. You can then sell quantities like 0.5 or 3.5 at the point of sale. Discrete products only accept whole numbers.`],
[`How do I make a sale?`,`In <b>Sales</b>, scan a barcode or type a product name and press Enter. Change the quantity, pick a wholesale price if needed and tick the discount box when a product has one. Choose the payment type (Cash, Card or Transfer) and click <b>Complete sale</b>. You can add or remove items freely before completing.`],
[`How do receipts print?`,`After every successful sale a receipt opens in your browser's print window and goes to your receipt printer. The Administrator sets how many copies print and the footer message (for example "Thank you, come again") under <b>Settings</b>. Every ticket carries a daily sequential number (Sales #1, #2, #3 … in English, Venta #1, #2 … in Spanish) that starts again at #1 each day and is shared by all users of the company. Numbers are never reused, so a deleted ticket leaves a visible gap.`],
[`How is VAT handled?`,`The Administrator sets the VAT percentage in <b>Settings</b> (default 0). When it is above 0, VAT is added to every sale, shown on the receipt and included in the sales reports.`],
[`How do I delete transactions?`,`<b>Last transaction:</b> in Sales click <i>Delete last transaction</i> (available to administrators and to users you permit). Stock is restored, but wallet units are never refunded.<br><b>Older transactions:</b> administrators open <b>Transactions</b>, filter, tick the sales and click <i>Delete selected</i>. You choose whether to restore stock. Wallet units are never refunded.<br><b>Bulk clean-up:</b> in <b>Settings</b>, delete everything before a chosen date. Deletions are permanent, but each one is recorded for the Administrator under <b>Reports &rarr; deleted</b> (who deleted it, when, and the full sale details). A bulk clean-up is logged as one summary line.<br><b>Products:</b> administrators can delete a product with the <i>Delete</i> button next to <i>Edit</i> in <b>Products</b>. Past sales are kept.`],
[`What reports can I get and can I export them?`,`<b>Reports</b> has sales, purchases, profit and loss, stock and charts (best sellers, best margins and monthly totals). Reports open on today's records; change the From and To dates to look at other days. Filter by date, product or seller, then export to CSV, Excel or PDF, or print. Administrators and semi-administrators see every user's sales; a normal user with the reports privilege sees only the sales made under their own account. The Sales today figure at the top counts today's sales the same way.`],
[`How do I back up and restore my data?`,`In <b>Settings</b> use <i>Download backup</i> regularly to save your products, sales, purchases and settings as a file. To restore, choose that file under <i>Restore from file</i>. Keep backups somewhere safe, especially before deleting old transactions. Administrators can also bulk-load products, users, company details and system settings from an Excel or JSON file under <b>Import</b>.`],
[`How do I create, print or export an invoice or quotation?`,`Open <b>Invoices / Quotations</b> and click <b>New invoice</b> or <b>New quotation</b>. Enter the customer's details and the dates, then add lines: pick a product from your stock list or type your own description, with quantity, unit price and an optional discount. VAT starts at your company rate and the totals update as you type. Click <b>Save</b>: the document gets its own number (INV-0001, QUO-0001 …, in Spanish FAC-0001, COT-0001 …) that is never reused. From the list or the document view you can <b>Print</b> it, export it as a <b>PDF</b> or download it as a <b>Word (.doc)</b> file. Administrators can allow other users to use this tool by ticking <i>invoices</i> on their user account. Normal users see only their own documents; administrators and semi-administrators see all. Invoices and quotations are documents only: they do not change your stock, sales or wallet. Put your bank details in <b>Settings → Default invoice notes</b> to have them appear on every new document.`]
];
const FAQ_ES=[
[`¿Cómo empiezo?`,`1) En la página de inicio de sesión pulse <b>Registrarse</b> e ingrese su nombre, apellido, nombre de la empresa, una contraseña (dos veces) y el idioma. 2) Anote el <b>ID de usuario</b> que aparece tras el registro (tiene la forma <i>nombre.apellido</i>) e inicie sesión con él. 3) Abra <b>Configuración</b> y complete la dirección, teléfono, correo, logotipo, IVA, idioma, moneda y pie del recibo de su empresa. 4) Agregue sus productos en <b>Productos</b>. 5) Comience a vender en <b>Ventas</b>.`],
[`¿Qué son las unidades de la billetera y cómo funcionan?`,`Cada cuenta de empresa nueva comienza con <b>100 unidades</b>. Cada venta exitosa usa <b>20 unidades</b>, que se descuentan en tiempo real de la billetera de la empresa (compartida por todo el personal de su cuenta). El saldo de la billetera y su número de ventas se muestran siempre en la parte superior de la pantalla. Si la billetera tiene menos de 20 unidades no se puede completar ninguna venta hasta que recargue.`],
[`¿Cómo recargo mi billetera?`,`Pague en la cuenta bancaria indicada en la pregunta de Información de pago y envíe su comprobante de pago y su <b>ID de usuario</b> al correo o teléfono de contacto. El Superadministrador acreditará en su billetera las unidades pagadas y el nuevo saldo aparecerá automáticamente en su pantalla.`],
[`¿Cuál es la información de pago?`,`<b>Banco:</b> Access Bank<br><b>Número de cuenta:</b> 1221166128<br><b>Nombre de la cuenta:</b> GiTeksol Solutions Limited<br>Use su ID de usuario como referencia del pago para que podamos acreditar la cuenta correcta rápidamente.`],
[`¿Cómo puedo contactar a soporte?`,`<b>Correo:</b> <a href="mailto:geocorpsys@gmail.com">geocorpsys@gmail.com</a><br><b>Teléfono:</b> <a href="tel:09038197586">09038197586</a>`],
[`¿Qué tipos de usuarios existen?`,`<b>Superadministrador</b> - controla todas las cuentas de empresa: activa o desactiva administradores y recarga billeteras.<br><b>Administrador</b> - la cuenta creada al registrarse. Gestiona productos, compras, informes, usuarios, configuración y eliminaciones, y puede crear otros administradores.<br><b>Semiadministrador</b> - un administrador con derechos limitados. Usted decide si puede ver informes, crear usuarios o eliminar la última transacción.<br><b>Usuario normal</b> - el vendedor. Puede realizar ventas, consultar productos e imprimir sus propias ventas; solo puede eliminar la última transacción o ver informes de ventas si usted lo permite.`],
[`¿Cómo creo, edito o elimino un usuario? ¿Y si alguien olvida su contraseña?`,`Vaya a <b>Usuarios</b>. Para agregar a alguien, ingrese sus nombres, una contraseña y un rol, marque los permisos que desee darle, pulse <b>Crear</b> y entréguele el ID de usuario que aparece. Para cambiar un nombre, rol o contraseña pulse <b>Editar</b> en su fila. También puede deshabilitar o eliminar usuarios allí. Si un empleado olvida su contraseña, edite el usuario y asigne una nueva. Si un administrador olvida la suya, contacte a soporte.`],
[`¿Cómo agrego productos y uso un lector de códigos de barras?`,`Abra <b>Productos</b>, escanee el código de barras (el lector escribe el código en el campo Código del producto) o escríbalo, luego ingrese el nombre, precios, cantidad y demás datos. La descripción copia el nombre hasta que la cambie. Puede agregar una foto opcional, datos del proveedor y stock mínimo/máximo. Un producto nuevo también se registra como una compra. Use <b>Compras</b> más adelante para reabastecer.`],
[`¿Cómo vendo artículos por peso o volumen (kg, litros)?`,`Al agregar el producto, configure <b>Tipo</b> como <i>Fraccionario</i>. Así podrá vender cantidades como 0.5 o 3.5 en el punto de venta. Los productos discretos solo aceptan números enteros.`],
[`¿Cómo realizo una venta?`,`En <b>Ventas</b>, escanee un código de barras o escriba el nombre del producto y pulse Enter. Cambie la cantidad, elija un precio mayorista si es necesario y marque la casilla de descuento cuando el producto tenga uno. Elija el tipo de pago (Efectivo, Tarjeta o Transferencia) y pulse <b>Completar venta</b>. Puede agregar o quitar artículos libremente antes de completar.`],
[`¿Cómo se imprimen los recibos?`,`Después de cada venta exitosa se abre el recibo en la ventana de impresión del navegador y se envía a su impresora de recibos. El Administrador define cuántas copias se imprimen y el mensaje del pie (por ejemplo "Gracias, vuelva pronto") en <b>Configuración</b>. Cada ticket lleva un número secuencial diario (Sales #1, #2, #3 … en inglés, Venta #1, #2 … en español) que vuelve a empezar en #1 cada día y es compartido por todos los usuarios de la empresa. Los números nunca se reutilizan, así que un ticket eliminado deja un hueco visible.`],
[`¿Cómo se maneja el IVA?`,`El Administrador define el porcentaje de IVA en <b>Configuración</b> (por defecto 0). Cuando es mayor que 0, el IVA se suma a cada venta, aparece en el recibo y se incluye en los informes de ventas.`],
[`¿Cómo elimino transacciones?`,`<b>Última transacción:</b> en Ventas pulse <i>Eliminar última transacción</i> (disponible para administradores y para los usuarios que usted autorice). El stock se restaura, pero las unidades de la billetera nunca se reembolsan.<br><b>Transacciones antiguas:</b> los administradores abren <b>Transacciones</b>, filtran, marcan las ventas y pulsan <i>Eliminar seleccionadas</i>. Usted decide si se restaura el stock. Las unidades de la billetera nunca se reembolsan.<br><b>Depuración masiva:</b> en <b>Configuración</b>, elimine todo lo anterior a una fecha elegida. Las eliminaciones son permanentes, pero cada una queda registrada para el Administrador en <b>Informes → eliminadas</b> (quién la eliminó, cuándo y todos los detalles de la venta). Una depuración masiva se registra como una línea de resumen.<br><b>Productos:</b> los administradores pueden eliminar un producto con el botón <i>Eliminar</i> junto a <i>Editar</i> en <b>Productos</b>. Las ventas pasadas se conservan.`],
[`¿Qué informes puedo obtener y puedo exportarlos?`,`<b>Informes</b> incluye ventas, compras, pérdidas y ganancias, inventario y gráficos (más vendidos, mejores márgenes y totales mensuales). Los informes se abren con los registros de hoy; cambie las fechas Desde y Hasta para ver otros días. Filtre por fecha, producto o vendedor y exporte a CSV, Excel o PDF, o imprima. Los administradores y semiadministradores ven las ventas de todos los usuarios; un usuario normal con privilegio de informes solo ve las ventas hechas con su propia cuenta. La cifra Ventas hoy, en la parte superior, cuenta las ventas de hoy de la misma manera.`],
[`¿Cómo hago una copia de seguridad y la restauro?`,`En <b>Configuración</b> use <i>Descargar copia</i> con regularidad para guardar sus productos, ventas, compras y ajustes en un archivo. Para restaurar, elija ese archivo en <i>Restaurar desde archivo</i>. Guarde las copias en un lugar seguro, sobre todo antes de eliminar transacciones antiguas. Los administradores también pueden cargar productos, usuarios, datos de la empresa y configuración del sistema desde un archivo Excel o JSON en <b>Importar</b>.`],
[`¿Cómo creo, imprimo o exporto una factura o cotización?`,`Abra <b>Facturas / Cotizaciones</b> y pulse <b>Nueva factura</b> o <b>Nueva cotización</b>. Ingrese los datos del cliente y las fechas, luego agregue líneas: elija un producto de su inventario o escriba su propia descripción, con cantidad, precio unitario y un descuento opcional. El IVA parte de la tasa de su empresa y los totales se actualizan al escribir. Pulse <b>Guardar</b>: el documento recibe su propio número (FAC-0001, COT-0001 …; en inglés INV-0001, QUO-0001 …) que nunca se reutiliza. Desde la lista o la vista del documento puede <b>Imprimirlo</b>, exportarlo como <b>PDF</b> o descargarlo como archivo <b>Word (.doc)</b>. Los administradores pueden permitir que otros usuarios usen esta herramienta marcando <i>facturas</i> en su cuenta de usuario. Los usuarios normales solo ven sus propios documentos; los administradores y semiadministradores ven todos. Las facturas y cotizaciones son solo documentos: no modifican su inventario, ventas ni billetera. Anote sus datos bancarios en <b>Configuración → Notas predeterminadas de la factura</b> para que aparezcan en cada documento nuevo.`]
];

const docPdf=id=>go(async()=>{if(!(window.jspdf&&window.jspdf.jsPDF))throw new Error(LS("The PDF library could not be loaded. Check your internet connection and refresh the page.","No se pudo cargar la biblioteca PDF. Revise su conexión a Internet y actualice la página."));
 const d=DOCS.find(x=>x.id==id),c=S.company,q=d.type=="quote",p=new window.jspdf.jsPDF({unit:"mm",format:"a4"}),M=15,R=195,pre=({NGN:"NGN",GHS:"GHS"})[d.currency]||(CURS[d.currency]||CURS.NGN)[0],   // the standard PDF fonts cannot draw the naira/cedi signs
 f=n=>pre+(/[A-Za-z]$/.test(pre)?" ":"")+(+n||0).toLocaleString(LOC(),{minimumFractionDigits:2,maximumFractionDigits:2}),lg=await logoData();let y=M;
 if(typeof p.autoTable!="function")throw new Error(LS("The PDF library could not be loaded. Check your internet connection and refresh the page.","No se pudo cargar la biblioteca PDF. Revise su conexión a Internet y actualice la página."));
 if(lg){const h=16,w=Math.min(40,h*lg.w/lg.h);try{p.addImage(lg.url,"PNG",M,y,w,h);y+=h+2}catch(e){}}
 p.setFont("helvetica","bold").setFontSize(16).setTextColor(17);p.text(String(c.name||""),M,y+5);y+=10;
 p.setFont("helvetica","normal").setFontSize(9).setTextColor(90);[c.address,c.phone,c.email].filter(Boolean).forEach(t=>p.splitTextToSize(String(t),90).forEach(l=>{p.text(l,M,y);y+=4.2}));
 p.setFont("helvetica","bold").setFontSize(24).setTextColor(30,86,200);p.text(q?LS("QUOTATION","COTIZACIÓN"):LS("INVOICE","FACTURA"),R,M+8,{align:"right"});
 p.setFontSize(12).setTextColor(17);p.text(d.number,R,M+15,{align:"right"});p.setFont("helvetica","normal").setFontSize(9).setTextColor(60);p.text(`${LS("Date","Fecha")}: ${d.date}`,R,M+21,{align:"right"});
 if(d.due)p.text(`${q?LS("Valid until","Válida hasta"):LS("Due date","Vencimiento")}: ${d.due}`,R,M+26,{align:"right"});
 y=Math.max(y,M+30)+2;p.setDrawColor(255,180,0).setLineWidth(1).line(M,y,R,y);y+=8;
 p.setFont("helvetica","normal").setFontSize(8).setTextColor(120);p.text(q?LS("PREPARED FOR","PREPARADA PARA"):LS("BILL TO","FACTURAR A"),M,y);y+=5;
 p.setFont("helvetica","bold").setFontSize(12).setTextColor(17);p.text(d.customer.name,M,y);y+=5;p.setFont("helvetica","normal").setFontSize(9).setTextColor(60);
 [d.customer.address,d.customer.phone,d.customer.email].filter(Boolean).forEach(t=>p.splitTextToSize(String(t),100).forEach(l=>{p.text(l,M,y);y+=4.2}));y+=4;
 p.autoTable({startY:y,head:[[LS("Description","Descripción"),LS("Qty","Cant."),LS("Unit price","Precio unit."),LS("Disc.","Desc."),LS("Amount","Importe")]],body:d.items.map(i=>[i.desc,i.qty,f(i.price),i.disc?i.disc+"%":"",f(i.line)]),headStyles:{fillColor:[30,86,200]},columnStyles:{1:{halign:"right"},2:{halign:"right"},3:{halign:"right"},4:{halign:"right"}},styles:{fontSize:9},margin:{left:M,right:210-R},didParseCell:x=>{if(x.section=="head"&&x.column.index>0)x.cell.styles.halign="right"}});
 y=p.lastAutoTable.finalY+6;const need=h=>{if(y+h>280){p.addPage();y=M}},row=(a,b,bold)=>{p.setFont("helvetica",bold?"bold":"normal").setFontSize(bold?12:10).setTextColor(17);p.text(a,130,y);p.text(b,R,y,{align:"right"});y+=bold?7:5.5};need(30);
 row("Subtotal",f(d.subtotal));if(d.vat)row(`${LS("VAT","IVA")} ${d.vat}%`,f(d.tax));y+=2;p.setDrawColor(30,86,200).setLineWidth(.5).line(130,y-4.5,R,y-4.5);row("Total",f(d.total),true);
 if(d.notes){y+=4;need(20);p.setFont("helvetica","bold").setFontSize(8).setTextColor(120);p.text(LS("NOTES","NOTAS"),M,y);y+=4.5;p.setFont("helvetica","normal").setFontSize(9).setTextColor(40);p.splitTextToSize(d.notes,R-M).forEach(l=>{need(6);p.text(l,M,y);y+=4.3})}
 p.setFontSize(8).setTextColor(140);p.text(`${LS("Issued by","Emitido por")}: ${d.by_name||d.by}`,M,290);p.save(`${DT(d.type)}-${d.number}.pdf`)});
/* ---------- settings ---------- */
function setV(){const c=S.company,s=S.system;$("#m").innerHTML=`<div class=card><h3>Company information</h3><div class=g>${inp("cn","Company name","text",c.name)}${inp("ca","Address","text",c.address)}${inp("cp","Telephone","text",c.phone)}${inp("ce","Email","email",c.email)}${inp("cv","VAT %","number",c.vat||0)}<label>Logo (optional)<input id=cl type=file accept="image/*"></label></div>
 <label>Default invoice notes (bank details, terms)<textarea id=cnotes rows=3>${E(c.invoice_notes||"")}</textarea></label>
 <p><label style="display:inline-flex;gap:8px;align-items:center"><input type=checkbox id=cshow style="width:auto" ${c.show_logo!==false?"checked":""}> Show company logo</label>${c.logo?` &nbsp; <img src="${E(c.logo)}" alt="" style="height:40px;vertical-align:middle"> <button class=d onclick="rmLogo()">Remove logo</button>`:""}</p></div>
<div class=card><h3>System information</h3><div class=g>${inp("sm","Max transactions before clean-up alert","number",s.max_tx)}${inp("sc","Receipt copies","number",s.copies)}${inp("sf","Receipt footer","text",s.footer)}<label>Language / Idioma<select id=sl onchange="$('#scu').value=this.value=='es'?'PESO':'NGN'"><option value=en ${LANG!="es"?"selected":""}>English</option><option value=es ${LANG=="es"?"selected":""}>Español</option></select></label><label>Currency<select id=scu>${Object.keys(CURS).map(k=>`<option value=${k} ${k==curKey()?"selected":""}>${CURS[k][LANG=="es"?2:1]} (${CURS[k][0]})</option>`).join("")}</select></label></div><br><button class=y onclick="saveS()">Save settings</button></div>
<div class=card><h3>Clean-up tool</h3><div class=g>${inp("cd","Delete transactions before","date")}</div><br><button class=r onclick="clean()">Delete old transactions</button></div>
<div class=card><h3>Backup &amp; restore</h3><button onclick="bk()">Download backup</button> <label style="display:inline-block">Restore from file<input id=rf type=file accept=".json" onchange="rs(this.files[0])"></label></div>`}
const rmLogo=()=>go(async()=>{if(!confirm(LS("Remove the company logo? You can upload a new one later.","¿Quitar el logotipo de la empresa? Podrá subir uno nuevo más adelante.")))return;const old=S.company.logo;
 const r=await api("/settings","PUT",{company:{...S.company,logo:""},system:S.system});try{await firebase.storage().refFromURL(old).delete()}catch(e){}   // best effort: also delete the stored file
 S={...S,...r};await boot();show("settings")});
const saveS=()=>go(async()=>{let logo=S.company.logo;const f=$("#cl").files[0];if(f)logo=await up(f,"logos");const r=await api("/settings","PUT",{company:{name:$("#cn").value,address:$("#ca").value,phone:$("#cp").value,email:$("#ce").value,vat:$("#cv").value,logo,show_logo:$("#cshow").checked,invoice_notes:$("#cnotes").value},system:{max_tx:$("#sm").value,copies:$("#sc").value,footer:$("#sf").value,lang:$("#sl").value,currency:$("#scu").value}});S={...S,...r};await boot();show("settings");alert(T("Saved"))});
const clean=()=>go(async()=>{if(!confirm(LS("This permanently deletes sales before that date. Download a backup first. Continue?","Esto elimina permanentemente las ventas anteriores a esa fecha. Descargue primero una copia de seguridad. ¿Continuar?")))return;const r=await api("/cleanup","POST",{before:$("#cd").value});alert(r.deleted+" "+LS("transactions deleted","transacciones eliminadas"));S={...S,...await api("/me")};hdr()});
const bk=()=>go(async()=>{const d=await api("/backup"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(d)],{type:"application/json"}));a.download="backup-"+new Date().toISOString().slice(0,10)+".json";a.click()});
const rs=f=>go(async()=>{if(!f||!confirm(LS("Replace ALL current company data with this backup?","¿Reemplazar TODOS los datos actuales de la empresa con esta copia?")))return;await api("/restore","POST",JSON.parse(await f.text()));S={...S,...await api("/me")};P=await api("/products");hdr();alert(T("Restored"))});
/* ---------- super admin ---------- */
async function accV(){const a=await api("/accounts");$("#m").innerHTML=`<div class=card><h3>Administrator accounts</h3>${tbl(["User ID","Name","Company","Wallet","Status","Top up","",],a.map(x=>[x.id,x.name,x.company,x.wallet,x.active?"Active":"Disabled",`<!><input id=tu_${x.id.replace(/\W/g,"_")} type=number style="width:90px" placeholder="units"> <button class=y onclick="topup('${x.id}')">Add</button>`,`<!><button onclick="acts('${x.id}',${!x.active})">${x.active?"Deactivate":"Activate"}</button>`]),"stack")}</div>`}
const topup=id=>go(async()=>{await api(`/accounts/${id}/topup`,"POST",{units:$("#tu_"+id.replace(/\W/g,"_")).value});accV()}),acts=(id,a)=>go(async()=>{await api(`/accounts/${id}/active`,"POST",{active:a});accV()});
if(TOK)api("/me").then(r=>{S=r;boot()}).catch(authView);else authView();
</script></body></html>
