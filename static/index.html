 $("#q").oninput=e=>{const v=e.target.value.toLowerCase();$("#sg").innerHTML=v?P.filter(p=>p.name.toLowerCase().includes(v)||p.code.includes(v)).slice(0,6).map(p=>`<button class=r style="margin:4px 4px 0 0" onclick="add('${E(p.code)}')">${E(p.name)} (${p.qty})</button>`).join(""):""};

 `<p class=tot>Subtotal ${money(t.sub)}${t.v?`<br>VAT ${t.v}%: ${money(t.tax)}`:""}<br><b>Total ${money(t.tot)}</b></p><div class=g><label>Payment<select id=pm><option value=cash>Cash</option><option value=card>Card (Bank)</option><option value=transfer>Transfer (Bank)</option></select></label></div><br><button class=y onclick="pay()">Complete sale</button> <button class=r onclick="cart=[];drawCart()">Clear</button>`:"<i>Cart is empty.</i>";

function receipt(s){const c=S.company,sy=S.system,one=`<div style="font:12px monospace;width:280px;margin:auto"><center><b>${E(c.name)}</b><br>${E(c.address||"")}<br>${E(c.phone||"")}</center><hr>${new Date(s.ts).toLocaleString()}<br>Receipt ${s.id} | Seller: ${E(s.seller_name)}<hr>${s.items.map(i=>`${E(i.name)}<br>&nbsp;${i.qty} x ${i.price}${i.disc?` (-${i.disc}%)`:""} = ${i.line.toFixed(2)}`).join("<br>")}<hr>Subtotal: ${s.subtotal.toFixed(2)}<br>${s.vat?`VAT ${s.vat}%: ${s.tax.toFixed(2)}<br>`:""}<b>TOTAL: ${s.total.toFixed(2)}</b><br>Paid by: ${s.payment}<hr><center>${E(sy.footer)}</center></div>`;
 const f=document.createElement("iframe");f.style.display="none";document.body.append(f);f.contentDocument.write(Array(sy.copies||1).fill(one).join('<div style="page-break-after:always"></div>'));f.contentDocument.close();f.contentWindow.print();setTimeout(()=>f.remove(),8000)}

 if(k=="sales"){h=["Date","Receipt","Seller","Product","Qty","Amount","Tax","Payment"];r=lines().map(i=>[i.s.ts.slice(0,16).replace("T"," "),i.s.id,i.s.seller,i.name,i.qty,i.line.toFixed(2),i.tax.toFixed(2),i.s.payment]);r.push(["TOTAL","","","","",sum(lines(),i=>i.line).toFixed(2),sum(lines(),i=>i.tax).toFixed(2),""])}
 else if(k=="purchases"){h=["Date","Product","Qty","Unit cost","Total","By","Supplier"];r=pl().map(x=>[x.ts.slice(0,10),x.name,x.qty,x.cost,x.total,x.by,x.supplier]);r.push(["TOTAL","","","",sum(pl(),x=>x.total).toFixed(2),"",""])}
 else if(k=="pnl"){const L=lines(),rev=sum(L,i=>i.line),cogs=sum(L,i=>i.qty*i.cost),pu=sum(pl(),x=>x.total),mi=sum(R.misc.filter(inR).filter(x=>x.type=="income"),x=>x.amount),me=sum(R.misc.filter(inR).filter(x=>x.type=="expense"),x=>x.amount);

 else{$("#rp").innerHTML=`<div class=g><div><canvas id=c1></canvas></div><div><canvas id=c2></canvas></div></div><canvas id=c3></canvas>`;const by={};lines().forEach(i=>{const o=by[i.name]??={q:0,rev:0,c:0};o.q+=i.qty;o.rev+=i.line;o.c+=i.qty*i.cost});

/* ---------- users ---------- */
async function userV(){const us=await api("/users"),pk=["reports","users","delete_last"];
 $("#m").innerHTML=`<div class=card><h3>Create user</h3><div class=g>${inp("uf","First name")}${inp("ul","Last name")}${inp("up","Password","password")}<label>Role<select id=ur>${S.user.role=="admin"?"<option value=admin>Administrator</option>":""}<option value=semi>Semi-administrator</option><option value=user>Normal user</option></select></label></div><p>${pk.map(k=>`<label style="display:inline-block;margin-right:12px"><input type=checkbox style="width:auto" id=pk_${k}> ${k.replace("_"," ")}</label>`).join("")}</p><button class=y onclick="addU()">Create</button></div><div class=card>${tbl(["User ID","Name","Role","Permissions","Status",""],us.map(u=>[u.id,u.name,u.role,u.role=="admin"?"all":`<!>${pk.map(k=>`<label style="display:inline-block;margin-right:8px"><input type=checkbox style="width:auto" ${u.perms[k]?"checked":""} onchange="perm('${u.id}','${k}',this.checked)"> ${k.replace("_"," ")}</label>`).join("")}`,u.active?"Active":"Disabled",u.id==S.user.id||u.id==S.user.tenant?"":`<!><button onclick="tog('${u.id}',${!u.active})">${u.active?"Disable":"Enable"}</button> <button class=r onclick="delU('${u.id}')">Delete</button>`]))}</div>`;window.US=us}
const addU=()=>go(async()=>{const perms={};["reports","users","delete_last"].forEach(k=>perms[k]=$("#pk_"+k).checked);const r=await api("/users","POST",{first:$("#uf").value,last:$("#ul").value,password:$("#up").value,role:$("#ur").value,perms});alert("Created. User ID: "+r.id);userV()});
const perm=(id,k,v)=>go(async()=>{const u=US.find(x=>x.id==id);u.perms[k]=v;await api("/users/"+id,"PATCH",{perms:u.perms})});
const tog=(id,a)=>go(async()=>{await api("/users/"+id,"PATCH",{active:a});userV()}),delU=id=>go(async()=>{if(confirm("Delete "+id+"?")){await api("/users/"+id,"DELETE");userV()}});
/* ---------- settings ---------- */
function setV(){const c=S.company,s=S.system;$("#m").innerHTML=`<div class=card><h3>Company information</h3><div class=g>${inp("cn","Company name","text",c.name)}${inp("ca","Address","text",c.address)}${inp("cp","Telephone","text",c.phone)}${inp("ce","Email","email",c.email)}${inp("cv","VAT %","number",c.vat||0)}<label>Logo (optional)<input id=cl type=file accept="image/*"></label></div></div>
<div class=card><h3>System information</h3><div class=g>${inp("sm","Max transactions before clean-up alert","number",s.max_tx)}${inp("sc","Receipt copies","number",s.copies)}${inp("sf","Receipt footer","text",s.footer)}</div><br><button class=y onclick="saveS()">Save settings</button></div>
<div class=card><h3>Clean-up tool</h3><div class=g>${inp("cd","Delete transactions before","date")}</div><br><button class=r onclick="clean()">Delete old transactions</button></div>
<div class=card><h3>Backup &amp; restore</h3><button onclick="bk()">Download backup</button> <label style="display:inline-block">Restore from file<input id=rf type=file accept=".json" onchange="rs(this.files[0])"></label></div>`}
const saveS=()=>go(async()=>{let logo=S.company.logo;const f=$("#cl").files[0];if(f)logo=await up(f,"logos");const r=await api("/settings","PUT",{company:{name:$("#cn").value,address:$("#ca").value,phone:$("#cp").value,email:$("#ce").value,vat:$("#cv").value,logo},system:{max_tx:$("#sm").value,copies:$("#sc").value,footer:$("#sf").value}});S={...S,...r};hdr();alert("Saved")});
const clean=()=>go(async()=>{if(!confirm("This permanently deletes sales before that date. Download a backup first. Continue?"))return;const r=await api("/cleanup","POST",{before:$("#cd").value});alert(r.deleted+" transactions deleted");S={...S,...await api("/me")};hdr()});
const bk=()=>go(async()=>{const d=await api("/backup"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(d)],{type:"application/json"}));a.download="backup-"+new Date().toISOString().slice(0,10)+".json";a.click()});
const rs=f=>go(async()=>{if(!f||!confirm("Replace ALL current company data with this backup?"))return;await api("/restore","POST",JSON.parse(await f.text()));S={...S,...await api("/me")};P=await api("/products");hdr();alert("Restored")});
/* ---------- super admin ---------- */
async function accV(){const a=await api("/accounts");$("#m").innerHTML=`<div class=card><h3>Administrator accounts</h3>${tbl(["User ID","Name","Company","Wallet","Status","Top up","",],a.map(x=>[x.id,x.name,x.company,x.wallet,x.active?"Active":"Disabled",`<!><input id=tu_${x.id.replace(/\W/g,"_")} type=number style="width:90px" placeholder="units"> <button class=y onclick="topup('${x.id}')">Add</button>`,`<!><button onclick="acts('${x.id}',${!x.active})">${x.active?"Deactivate":"Activate"}</button>`]))}</div>`}
const topup=id=>go(async()=>{await api(`/accounts/${id}/topup`,"POST",{units:$("#tu_"+id.replace(/\W/g,"_")).value});accV()}),acts=(id,a)=>go(async()=>{await api(`/accounts/${id}/active`,"POST",{active:a});accV()});
if(TOK)api("/me").then(r=>{S=r;boot()}).catch(authView);else authView();
</script></body></html>
