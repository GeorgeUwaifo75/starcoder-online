<style>

.w{overflow-x:auto}table{border-collapse:collapse;width:100%}th{background:var(--b);color:#fff;text-align:left}td,th{padding:6px 8px;border-bottom:1px solid #dde}

.fa{border-bottom:1px solid #dde;padding:8px 0}.fa summary{cursor:pointer;font-weight:700;color:var(--b)}.fa div{padding:8px 0 4px;line-height:1.55}.fa a{color:var(--b);font-weight:700}

const V={sales:posV,products:prodV,purchases:purV,reports:repV,users:userV,transactions:txV,settings:setV,faq:faqV,accounts:accV};

const price=(p,t)=>t!="price"&&p[t]>0?p[t]:p.price;
function calc(){let sub=0;cart.forEach(c=>{const p=P.find(x=>x.code==c.code);c.line=c.qty*price(p,c.tier)*(1-(c.disc?p.discount:0)/100);sub+=c.line});const v=+S.company.vat||0;return{sub,tax:sub*v/100,tot:sub*(1+v/100),v}}

 $("#q").oninput=e=>{const v=e.target.value.toLowerCase();$("#sg").innerHTML=v?P.filter(p=>p.name.toLowerCase().includes(v)||p.code.includes(v)).slice(0,6).map(p=>`<button class=r style="margin:4px 4px 0 0" onclick="add('${E(p.code)}')">${E(p.name)} (${p.qty})</button>`).join(""):""};
 $("#q").onkeydown=e=>{if(e.key!="Enter")return;const v=e.target.value.trim(),l=v.toLowerCase(),p=P.find(x=>x.code==v)||P.find(x=>x.name.toLowerCase().includes(l));p?add(p.code):alert("Product not found")};drawCart()}
function add(code){const c=cart.find(x=>x.code==code),p=P.find(x=>x.code==code);if(!p.qty)return alert("Out of stock");c?c.qty+=1:cart.push({code,qty:1,tier:"price",disc:false});$("#q").value="";$("#sg").innerHTML="";drawCart();$("#q").focus()}
function drawCart(){const t=calc();$("#ct").innerHTML=cart.length?tbl(["Product","Price","Qty","Discount","Total",""],cart.map((c,i)=>{const p=P.find(x=>x.code==c.code);return[p.name,`<!><select onchange="cart[${i}].tier=this.value;drawCart()"><option value=price>Retail ${p.price}</option>${p.w1>0?`<option value=w1 ${c.tier=="w1"?"selected":""}>W1 ${p.w1}</option>`:""}${p.w2>0?`<option value=w2 ${c.tier=="w2"?"selected":""}>W2 ${p.w2}</option>`:""}</select>`,`<!><input style="width:80px" type=number step=${p.ptype=="float"?"any":1} min=0 value=${c.qty} onchange="cart[${i}].qty=+this.value;drawCart()">`,p.discount>0?`<!><label><input type=checkbox style="width:auto" ${c.disc?"checked":""} onchange="cart[${i}].disc=this.checked;drawCart()"> ${p.discount}% off</label>`:"-",money(c.line),`<!><button class=r onclick="cart.splice(${i},1);drawCart()">✕</button>`]}))+
 `<p class=tot>Subtotal ${money(t.sub)}${t.v?`<br>VAT ${t.v}%: ${money(t.tax)}`:""}<br><b>Total ${money(t.tot)}</b></p><div class=g><label>Payment<select id=pm><option value=cash>Cash</option><option value=card>Card (Bank)</option><option value=transfer>Transfer (Bank)</option></select></label></div><br><button class=y onclick="pay()">Complete sale</button> <button class=r onclick="cart=[];drawCart()">Clear</button>`:"<i>Cart is empty.</i>";
 if(can("delete_last"))$("#ct").innerHTML+=` <button class=r onclick="delLast()">Delete last transaction</button>`}
const pay=()=>go(async()=>{const r=await api("/sales","POST",{items:cart.map(c=>({code:c.code,qty:c.qty,tier:c.tier,disc:c.disc})),payment:$("#pm").value});cart=[];S.wallet=r.wallet;S.sales_count++;P=await api("/products");hdr();receipt(r.sale);posV()});
const delLast=()=>go(async()=>{if(!confirm("Delete the last transaction? Stock will be restored and the 20 wallet units refunded."))return;const r=await api("/sales/last","DELETE");S.wallet=r.wallet;S.sales_count--;P=await api("/products");hdr();alert("Deleted. Stock restored and units refunded.")});
function receipt(s){const c=S.company,sy=S.system,one=`<div style="font:12px monospace;width:280px;margin:auto"><center><b>${E(c.name)}</b><br>${E(c.address||"")}<br>${E(c.phone||"")}</center><hr>${new Date(s.ts).toLocaleString()}<br>Receipt ${s.id} | Seller: ${E(s.seller_name)}<hr>${s.items.map(i=>`${E(i.name)}<br>&nbsp;${i.qty} x ${i.price}${i.disc?` (-${i.disc}%)`:""} = ${i.line.toFixed(2)}`).join("<br>")}<hr>Subtotal: ${s.subtotal.toFixed(2)}<br>${s.vat?`VAT ${s.vat}%: ${s.tax.toFixed(2)}<br>`:""}<b>TOTAL: ${s.total.toFixed(2)}</b><br>Paid by: ${s.payment}<hr><center>${E(sy.footer)}</center></div>`;
 const f=document.createElement("iframe");f.style.display="none";document.body.append(f);f.contentDocument.write(Array(sy.copies||1).fill(one).join('<div style="page-break-after:always"></div>'));f.contentDocument.close();f.contentWindow.print();setTimeout(()=>f.remove(),8000)}
/* ---------- products ---------- */
function prodV(){const ED=S.user.role!="user";$("#m").innerHTML=`<div class=card><h3>Find a product <small>(optional)</small></h3><input id=pq placeholder="Scan barcode or type product name / code" autocomplete=off><div class=g id=pr style="margin-top:10px"></div></div>${ED?`<div class=card><h3>Product</h3><div class=g>${inp("code","Product code (scan or type)")}${inp("name","Product name")}${inp("desc","Description")}${inp("cost","Cost","number",0)}<label>Type<select id=ptype><option value=discrete>Discrete (1,2,3…)</option><option value=float>Fractional (kg, litres)</option></select></label>${inp("price","Sales price","number",0)}${inp("w1","Wholesale price #1","number",0)}${inp("w2","Wholesale price #2","number",0)}${inp("discount","Discount % (optional)","number",0)}${inp("qty","Initial quantity","number",0)}${inp("supplier","Supplier (optional)")}${inp("phone","Supplier phone (optional)")}${inp("min","Min stock","number",5)}${inp("max","Max stock","number",20)}<label>Image<input id=img type=file accept="image/*"></label></div><br><button class=y onclick="saveP()">Save product</button> <button class=r onclick="prodV()">New</button></div>`:""}<div class=card id=pl></div>`;
 if(ED){$("#name").oninput=e=>{if(!$("#desc").dataset.t)$("#desc").value=e.target.value};$("#desc").oninput=e=>e.target.dataset.t=1}
 $("#pq").oninput=lookup;$("#pq").onkeydown=e=>{if(e.key=="Enter")lookup()};
 $("#pl").innerHTML=tbl(ED?["","Code","Name","Qty","Price","Cost",""]:["","Code","Name","Qty","Price"],P.map((p,i)=>[`<!>${img(p,"th")}`,p.code,p.name,p.qty,money(p.price),...ED?[money(p.cost),`<!><button onclick="editP(${i})">Edit</button>`]:[]]))}
const okImg=u=>/^https:\/\//.test(u||""),img=(p,c)=>okImg(p.image)?`<img class=${c} src="${E(p.image)}" alt="" loading=lazy>`:(c=="th"?"":`<div class=ph>📦</div>`);
function lookup(){const q=$("#pq").value.trim().toLowerCase(),r=$("#pr");if(!q){r.innerHTML="";return}
 const a=P.filter(p=>p.code.toLowerCase()==q||p.name.toLowerCase().includes(q)||p.code.toLowerCase().includes(q)).slice(0,12);
 r.innerHTML=a.length?a.map(p=>`<div class=pc>${img(p,"ph")}<b>${E(p.name)}</b><br><small>Code: ${E(p.code)}</small><br>${E(p.desc&&p.desc!=p.name?p.desc:"")}<br>Price: <b>${money(p.price)}</b>${p.w1>0?` · W1 ${money(p.w1)}`:""}${p.w2>0?` · W2 ${money(p.w2)}`:""}${p.discount>0?` · ${p.discount}% off`:""}<br>In stock: <b>${p.qty}</b>${p.qty<=p.min?" <span style='color:#c00'>(low)</span>":""}${ED?`<br><small>Cost ${money(p.cost)}${p.supplier?" · "+E(p.supplier):""}</small>`:""}</div>`).join(""):"<i>No matching product.</i>"}
function editP(i){const p=P[i];for(const k of["code","name","desc","cost","ptype","price","w1","w2","discount","supplier","phone","min","max"])$("#"+k).value=p[k];$("#desc").dataset.t=1;$("#qty").value=p.qty;$("#qty").disabled=$("#code").disabled=true;$("#code").dataset.edit=1;window.scrollTo(0,0)}
const saveP=()=>go(async()=>{const b={};for(const k of["code","name","desc","cost","ptype","price","w1","w2","discount","qty","supplier","phone","min","max"])b[k]=$("#"+k).value;const f=$("#img").files[0];if(f)b.image=await up(f,"products");
 $("#code").dataset.edit?await api("/products/"+encodeURIComponent(b.code),"PUT",b):await api("/products","POST",b);P=await api("/products");prodV()});
/* ---------- purchases ---------- */
async function purV(){const l=await api("/ledger").catch(()=>({purchases:[]}));$("#m").innerHTML=`<div class=card><h3>New purchase (restock)</h3><div class=g><label>Product<select id=pc>${P.map(p=>`<option value="${E(p.code)}">${E(p.name)}</option>`).join("")}</select></label>${inp("pq","Quantity","number")}${inp("pcost","Unit cost","number")}${inp("ps","Supplier")}</div><br><button class=y onclick="addPur()">Register purchase</button></div>
<div class=card><h3>Miscellaneous income / expense</h3><div class=g><label>Type<select id=mt><option value=income>Income</option><option value=expense>Expense</option></select></label>${inp("ma","Amount","number")}${inp("mn","Note")}${inp("md","Date","date",new Date().toISOString().slice(0,10))}</div><br><button class=y onclick="addMisc()">Save</button></div>
<div class=card>${tbl(["Date","Product","Qty","Cost","Total","By"],l.purchases.slice().reverse().slice(0,50).map(x=>[x.ts.slice(0,10),x.name,x.qty,x.cost,x.total,x.by]))}</div>`}
const addPur=()=>go(async()=>{await api("/purchases","POST",{code:$("#pc").value,qty:$("#pq").value,cost:$("#pcost").value||undefined,supplier:$("#ps").value});P=await api("/products");purV()});

let R={};
async function repV(){R.sales=await api("/sales");R.purchases=[];R.misc=[];if(S.user.role!="user")try{Object.assign(R,await api("/ledger"))}catch(e){}
 P=S.user.role=="super"?[]:await api("/products");const full=S.user.role!="user";
 $("#m").innerHTML=`<div class=card><div class=g>${inp("f1","From","date")}${inp("f2","To","date")}${inp("fp","Product contains")}${inp("fs","Seller ID contains")}</div><br>${["sales",...full?["purchases","pnl","stock","charts"]:[]].map(k=>`<button onclick="rep('${k}')">${k}</button> `).join("")}</div><div class=card id=rp></div>`;rep("sales")}
const inR=x=>{const d=x.ts.slice(0,10);return(!$("#f1").value||d>=$("#f1").value)&&(!$("#f2").value||d<=$("#f2").value)};
const fl=(a,k,id)=>$(id).value?a.filter(x=>String(x[k]).toLowerCase().includes($(id).value.toLowerCase())):a;
const sl=()=>fl(R.sales.filter(inR),"seller","#fs"),lines=()=>sl().flatMap(s=>s.items.filter(i=>i.name.toLowerCase().includes($("#fp").value.toLowerCase())).map(i=>({...i,s,tax:i.line*s.vat/100})));

function rep(k){let h,r,t=k;const sum=(a,f)=>a.reduce((x,y)=>x+f(y),0);
 if(k=="sales"){h=["Date","Receipt","Seller","Product","Qty","Amount","Tax","Payment"];r=lines().map(i=>[i.s.ts.slice(0,16).replace("T"," "),i.s.id,i.s.seller,i.name,i.qty,i.line.toFixed(2),i.tax.toFixed(2),i.s.payment]);r.push(["TOTAL","","","","",sum(lines(),i=>i.line).toFixed(2),sum(lines(),i=>i.tax).toFixed(2),""])}
 else if(k=="purchases"){h=["Date","Product","Qty","Unit cost","Total","By","Supplier"];r=pl().map(x=>[x.ts.slice(0,10),x.name,x.qty,x.cost,x.total,x.by,x.supplier]);r.push(["TOTAL","","","",sum(pl(),x=>x.total).toFixed(2),"",""])}
 else if(k=="pnl"){const L=lines(),rev=sum(L,i=>i.line),cogs=sum(L,i=>i.qty*i.cost),pu=sum(pl(),x=>x.total),mi=sum(R.misc.filter(inR).filter(x=>x.type=="income"),x=>x.amount),me=sum(R.misc.filter(inR).filter(x=>x.type=="expense"),x=>x.amount);
  h=["Item","Amount"];r=[["Sales revenue (excl. tax)",rev],["Tax collected",sum(L,i=>i.tax)],["Cost of goods sold",cogs],["Gross profit",rev-cogs],["Purchases in period",pu],["Misc. income",mi],["Misc. expenses",me],["Net result (sales − purchases + misc income − misc expenses)",rev-pu+mi-me]].map(x=>[x[0],x[1].toFixed(2)])}
 else if(k=="stock"){h=["Code","Product","Qty","Min","Max","Cost","Stock value","Status"];r=P.map(p=>[p.code,p.name,p.qty,p.min,p.max,p.cost,(p.qty*p.cost).toFixed(2),p.qty<=p.min?"LOW":p.qty>p.max?"OVER":"OK"])}
 else{$("#rp").innerHTML=`<div class=g><div><canvas id=c1></canvas></div><div><canvas id=c2></canvas></div></div><canvas id=c3></canvas>`;const by={};lines().forEach(i=>{const o=by[i.name]??={q:0,rev:0,c:0};o.q+=i.qty;o.rev+=i.line;o.c+=i.qty*i.cost});
  const n=Object.keys(by).sort((a,b)=>by[b].q-by[a].q).slice(0,8),pr=Object.keys(by).sort((a,b)=>(by[b].rev-by[b].c)-(by[a].rev-by[a].c)).slice(0,8);
  new Chart($("#c1"),{type:"pie",data:{labels:n,datasets:[{data:n.map(x=>by[x].q),backgroundColor:["#1e56c8","#ffb400","#111","#6f95e6","#ffd36b","#555","#a9c0f0","#ffe8b0"]}]},options:{plugins:{title:{display:true,text:"Best-selling products (qty)"}}}});
  new Chart($("#c2"),{type:"bar",data:{labels:pr,datasets:[{label:"Profit",data:pr.map(x=>+(by[x].rev-by[x].c).toFixed(2)),backgroundColor:"#ffb400"},{label:"Margin %",data:pr.map(x=>+(100*(by[x].rev-by[x].c)/(by[x].rev||1)).toFixed(1)),backgroundColor:"#1e56c8"}]},options:{plugins:{title:{display:true,text:"Top profit products & margin"}}}});
  const mo={};sl().forEach(s=>(mo[s.ts.slice(0,7)]??={s:0,p:0}).s+=s.total);pl().forEach(x=>(mo[x.ts.slice(0,7)]??={s:0,p:0}).p+=x.total);const ms=Object.keys(mo).sort();
  new Chart($("#c3"),{type:"bar",data:{labels:ms,datasets:[{label:"Sales",data:ms.map(m=>mo[m].s),backgroundColor:"#1e56c8"},{label:"Purchases",data:ms.map(m=>mo[m].p),backgroundColor:"#ffb400"}]},options:{plugins:{title:{display:true,text:"Monthly report"}}}});return}

 else{const d=new jspdf.jsPDF();d.text(`${S.company.name} - ${t}`,14,12);d.autoTable({head:[h],body:r,startY:18});d.save(t+".pdf")}}

 $("#m").innerHTML=`<div class=card><h3>Transactions</h3><div class=g>${inp("tf","From","date")}${inp("tt","To","date")}${inp("tq","Seller / receipt / product contains")}</div><p><label style="display:inline-block;margin-right:14px"><input type=checkbox id=trs style="width:auto"> Restore stock</label><label style="display:inline-block"><input type=checkbox id=trf style="width:auto"> Refund 20 units per transaction</label></p><button class=r onclick="delSel()">Delete selected</button> <button onclick="selAll(true)">Select all shown</button> <button onclick="selAll(false)">Clear</button></div><div class=card id=txl></div>`;

/* ---------- FAQ ---------- */
const FAQ=[
[`How do I get started?`,`1) On the login page click <b>Sign up</b> and enter your first name, last name, company name and a password (twice). 2) Note the <b>User ID</b> shown after sign-up (it looks like <i>first.last</i>) and log in with it. 3) Open <b>Settings</b> and fill in your company address, telephone, email, logo, VAT and receipt footer. 4) Add your products in <b>Products</b>. 5) Start selling in <b>Sales</b>.`],
[`What are wallet units and how do they work?`,`Every new company account starts with <b>100 units</b>. Each successful sale uses <b>20 units</b>, deducted in real time from the company wallet (shared by all staff under your account). The wallet balance and your number of sales are always shown at the top of the screen. When the wallet is below 20 units no sale can be completed until you top up.`],
[`How do I top up my wallet?`,`Pay into the bank account in the Payment Information question below, then send your proof of payment and your <b>User ID</b> to our contact email or phone number. The Super Administrator will credit your wallet with the units you paid for, and the new balance appears on your screen automatically.`],
[`What is the payment information?`,`<b>Bank:</b> Access Bank<br><b>Account number:</b> 1221166128<br><b>Account name:</b> GiTeksol Solutions Limited<br>Please use your User ID as the payment reference so we can credit the right account quickly.`],
[`How can I contact support?`,`<b>Email:</b> <a href="mailto:geocorpsys@gmail.com">geocorpsys@gmail.com</a><br><b>Telephone:</b> <a href="tel:09038197586">09038197586</a>`],
[`What are the different types of users?`,`<b>Super Administrator</b> - controls every company account: activates or deactivates administrators and tops up wallets.<br><b>Administrator</b> - the account created at sign-up. Manages products, purchases, reports, users, settings and deletions, and can create other administrators.<br><b>Semi-Administrator</b> - an administrator with limited rights. You decide whether they can view reports, create users or delete the last transaction.<br><b>Normal user</b> - the sales person. Can make sales, look up products and print their own sales; can delete the last transaction or view sales reports only if you allow it.`],
[`How do I create, edit or remove a user? What if someone forgets a password?`,`Go to <b>Users</b>. To add someone, enter their names, a password and a role, tick the permissions you want to give, then click <b>Create</b> and give them the User ID shown. To change a name, role or password click <b>Edit</b> on their row. You can also disable or delete users there. If a staff member forgets their password, edit the user and set a new one. If an administrator forgets theirs, please contact support.`],
[`How do I add products and use a barcode scanner?`,`Open <b>Products</b>, scan the barcode (the scanner types the code into the Product code box) or type it, then enter the name, prices, quantity and other details. The description copies the name until you change it. You can add an optional photo, supplier details and minimum/maximum stock. A new product is also recorded as a purchase. Use <b>Purchases</b> later to restock.`],
[`How do I sell items by weight or volume (kg, litres)?`,`When adding the product set <b>Type</b> to <i>Fractional</i>. You can then sell quantities like 0.5 or 3.5 at the point of sale. Discrete products only accept whole numbers.`],
[`How do I make a sale?`,`In <b>Sales</b>, scan a barcode or type a product name and press Enter. Change the quantity, pick a wholesale price if needed and tick the discount box when a product has one. Choose the payment type (Cash, Card or Transfer) and click <b>Complete sale</b>. You can add or remove items freely before completing.`],
[`How do receipts print?`,`After every successful sale a receipt opens in your browser's print window and goes to your receipt printer. The Administrator sets how many copies print and the footer message (for example "Thank you, come again") under <b>Settings</b>.`],
[`How is VAT handled?`,`The Administrator sets the VAT percentage in <b>Settings</b> (default 0). When it is above 0, VAT is added to every sale, shown on the receipt and included in the sales reports.`],
[`How do I delete transactions?`,`<b>Last transaction:</b> in Sales click <i>Delete last transaction</i> (available to administrators and to users you permit). Stock is restored and the 20 units are refunded.<br><b>Older transactions:</b> administrators open <b>Transactions</b>, filter, tick the sales and click <i>Delete selected</i>. You choose whether to restore stock and refund units.<br><b>Bulk clean-up:</b> in <b>Settings</b>, delete everything before a chosen date. Deletions are permanent, so download a backup first.`],
[`What reports can I get and can I export them?`,`<b>Reports</b> has sales, purchases, profit and loss, stock and charts (best sellers, best margins and monthly totals). Filter by date, product or seller, then export to CSV, Excel or PDF, or print.`],
[`How do I back up and restore my data?`,`In <b>Settings</b> use <i>Download backup</i> regularly to save your products, sales, purchases and settings as a file. To restore, choose that file under <i>Restore from file</i>. Keep backups somewhere safe, especially before deleting old transactions.`]
];
